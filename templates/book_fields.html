<label>Title<input name="title" required value="{{book.title if book else ''}}"></label><label>Author<input name="author" required value="{{book.author if book else ''}}"></label><label>Category<input name="category" required value="{{book.category if book else ''}}"></label><label>ISBN<input name="isbn" value="{{book.isbn if book else ''}}"></label><label>Copies<input name="copies" type="number" min="1" required value="{{book.copies if book else 1}}"></label>
