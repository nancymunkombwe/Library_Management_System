{% extends 'base.html' %}{% block content %}<p class="muted">Issue books, record returns and monitor due dates.</p><section><h2>Issue a book</h2><form method="post" class="fields"><label>Book<select name="book_id" required><option value="">Select book</option>{% for b in books %}<option value="{{b.id}}">{{b.title}} ({{b.available}} available)</option>{% endfor %}</select></label><label>Member<select name="member_id" required><option value="">Select member</option>{% for m in members %}<option value="{{m.id}}">{{m.name}}</option>{% endfor %}</select></label><label>Due date<input type="date" name="due" min="{{today}}" value="{{due}}" required></label><button>Issue book</button></form></section><section><h2>Loan history</h2>{% include 'loan_table.html' %}</section>{% endblock %}
