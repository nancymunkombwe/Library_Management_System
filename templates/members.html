{% extends 'base.html' %}{% block content %}<p class="muted">Register borrowers and manage membership.</p><section><h2>Register member</h2><form method="post" class="fields"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><button>Register</button></form></section><section><h2>Member directory</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Active loans</th><th>Action</th></tr></thead><tbody>{% for m in members %}<tr><td>{{m.name}}</td><td>{{m.email}}</td><td>{{m.active}}</td><td><form method="post" action="{{url_for('delete_member',id=m.id)}}" onsubmit="return confirm('Remove this member?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No members yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
